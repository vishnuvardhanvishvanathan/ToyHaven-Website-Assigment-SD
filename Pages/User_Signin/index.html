        <main>
            <section class="login-box">
                <form action="" class="form-box" id="signinform">
                    <h2>Sign IN</h2>
                    <input type="text" name="username" id="username" placeholder="Please Enter your Full Name" required>
                    <input type="email" name="signinemail" id="signinemail" placeholder="Enter Email" required >
                    
                    <input type="password" name="newpassword" id="signinpassword" placeholder="Enter Password" required>
                    <input type="password" name="checkpassword" id="checkpassword" placeholder="Re-enter Password" required>
                    <span id="errormsg" class="error-text"></span>
                    
                    <button type="submit" id="signin">Sign In</button>
                    <span>Already have an account? </span>
                    <a href="../User_Login/index.html">Login</a>
                </form>
            </section>
