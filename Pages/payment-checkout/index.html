<body>

        <nav class = "navbar">
            <a href="../../index.html" class="nav-logo">

            </a>
        </nav>
    </header>
    <main>
        <section class="wrapper">
            <section class="payment">

                <h2>Payment Gateway</h2>
                <section class="form">
                    <section class="card space">
                        <label for="" class="label">Card Holder:</label>
                        <input type="text" class="input" name="card_holder" id="card_holder" pattern="[a-zA-z]*" placeholder="Card Holder">
                        <img src="../../images/person.svg" alt="" class="inputimg2">
                    </section>
                    <section class="card space">
                        <label for="" class="label">Card Number:</label>
                        <input type="number" class="input" name="card_number" id="card_number" max="10" placeholder="Card Number">
                        <img src="../../images/credit_card.svg" alt="" class="inputimg2">
                    </section>
                    <section class="card-grp space">
                        <section class="card-item">
                            <label for="" class="label">Expiry date:</label>
                            <input type="date" class="input" name="expiry_date" id="expiry_date" placeholder="00 / 00">
                            <img src="../../images/calendar.svg" alt="" class="inputimg">
                        </section>
                        <section class="card-item">
                            <label for="" class="label">CVC:</label>
                            <input type="text" class="input" name="cvc" id="cvc" placeholder="000">
                            <img src="../../images/lock.svg" alt="" class="inputimg">

                        </section>
                    </section>
                    <section class="paybtn">Pay</section>

                </section>
            </section>
        </section>
    </main>
    
<script src="../../Js/hamburger.js"></script>
<script src="../../Js/paymentcheckout.js"></script>
    </body>
</html>
